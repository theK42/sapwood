# Builds the server's Docker image and publishes it to GitHub's container registry as
# ghcr.io/thek42/sapwood: `latest` and the commit's SHA, on each push to main, or by hand.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thek42/sapwood:latest
            ghcr.io/thek42/sapwood:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# fly.toml app configuration file generated for sapwood-demo on 2026-11-27T16:22:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sapwood-demo'
primary_region = 'sjc'

[build]
  image = 'ghcr.io/thek42/sapwood:latest'

[env]
  PORT = '8080'
  SAPWOOD_DB = '/data/sapwood.sqlite'
  SAPWOOD_HOST = '0.0.0.0'
  SAPWOOD_INIT_ADMIN = 'thek42'
  SAPWOOD_INIT_PROJECT = 'krbsg'
  SAPWOOD_PUBLIC_URL = 'https://sapwood-demo.fly.dev'
  # A demo: anyone signing in with GitHub becomes an Editor. Remove it (or set 'viewer')
  # to have people ask for access instead, granted on the Admin page.
  SAPWOOD_SIGNUP_ROLE = 'editor'

[[mounts]]
  source = 'sapwood_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
